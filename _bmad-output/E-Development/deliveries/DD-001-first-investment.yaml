# WDS Design Delivery — the contract between design and development.
delivery:
  id: "DD-001"
  name: "First Investment (Scenario 01)"
  type: "user_flow"
  status: "ready"
  priority: "high"
  created_by: "freya (WDS)"
  created_at: "2026-07-07T00:00:00Z"
  updated_at: "2026-07-07T00:00:00Z"
  version: "1.0"

description: |
  The end-to-end path from discovering a property to owning a fractional share of it,
  with the crypto made invisible. Explore → Property Detail → Set up & fund (Privy/KYC/USDC)
  → Calculator & order preview → Rights & risks acknowledgement → atomic-DvP Confirmation.
  This is the make-or-break journey: a first-timer must be able to answer "what do I own,
  where does the return come from, and how do I get out?" and complete a funded investment.

user_value:
  problem: "Money-app-native young adults want low-minimum, income-producing real estate but don't trust opaque, crypto-complex products."
  solution: "A mobile-first flow that proves the asset is real (What-You-Own, diligence gates), honest about returns and exit, with wallets/USDC abstracted behind a fiat-like experience."
  success_criteria:
    - "≥90% of funded users can correctly answer 'what do you own?' (O3 comprehension / north-star)"
    - "Visitor→funded-investor conversion instrumented across every step (O2)"
    - "Zero properties reach the invest flow without all diligence gates human-signed (O1)"

