  <!-- ground-floor storefronts -->
  <rect x="210" y="388" width="380" height="66" fill="#14142B"/>
  <rect x="228" y="402" width="96" height="44" rx="4" fill="url(#store)"/>
  <rect x="352" y="402" width="96" height="44" rx="4" fill="url(#store)"/>
  <rect x="476" y="402" width="96" height="44" rx="4" fill="#2C2760"/>
  <rect x="0" y="452" width="800" height="148" fill="#14142B"/>
