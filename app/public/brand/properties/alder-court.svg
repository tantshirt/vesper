    <rect x="408" y="196" width="36" height="42" rx="3" fill="#2C2760"/>
    <rect x="464" y="196" width="36" height="42" rx="3" fill="url(#lit3)"/>
    <rect x="520" y="196" width="36" height="42" rx="3" fill="#2C2760"/>

    <rect x="240" y="256" width="36" height="42" rx="3" fill="#2C2760"/>
    <rect x="296" y="256" width="36" height="42" rx="3" fill="url(#lit3)"/>
    <rect x="352" y="256" width="36" height="42" rx="3" fill="#2C2760"/>
    <rect x="408" y="256" width="36" height="42" rx="3" fill="url(#lit3)"/>
    <rect x="464" y="256" width="36" height="42" rx="3" fill="#2C2760"/>
    <rect x="520" y="256" width="36" height="42" rx="3" fill="url(#lit3)"/>

    <rect x="240" y="316" width="36" height="42" rx="3" fill="url(#lit3)"/>
    <rect x="296" y="316" width="36" height="42" rx="3" fill="#2C2760"/>
    <rect x="352" y="316" width="36" height="42" rx="3" fill="url(#lit3)"/>
    <rect x="408" y="316" width="36" height="42" rx="3" fill="#2C2760"/>
    <rect x="464" y="316" width="36" height="42" rx="3" fill="#2C2760"/>
    <rect x="520" y="316" width="36" height="42" rx="3" fill="url(#lit3)"/>
