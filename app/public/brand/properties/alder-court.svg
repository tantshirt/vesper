<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Alder Court — a mixed-use building at dusk">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="0.5" stop-color="#3A2E63"/>
      <stop offset="0.79" stop-color="#8A6E86"/>
      <stop offset="1" stop-color="#E8C88C"/>
    </linearGradient>
    <radialGradient id="sun3" cx="0.6" cy="0.9" r="0.5">
      <stop offset="0" stop-color="#F3E1B0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E8C88C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E6BE"/>
      <stop offset="1" stop-color="#E8C88C"/>
    </linearGradient>
    <linearGradient id="store" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E6BE"/>
      <stop offset="1" stop-color="#EAD9A0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky3)"/>
  <rect width="800" height="600" fill="url(#sun3)"/>
  <path d="M170 74 L176 96 L198 102 L176 108 L170 130 L164 108 L142 102 L164 96 Z" fill="#F6E6BE"/>
  <rect x="60" y="330" width="76" height="180" rx="3" fill="#211C4A" opacity="0.7"/>
  <rect x="672" y="300" width="86" height="210" rx="3" fill="#211C4A" opacity="0.7"/>
  <!-- mixed-use: residential block above, storefronts at base -->
